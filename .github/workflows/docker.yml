# Checks, on every push, that the Docker version of the site builds and works:
# tests in the image, production images, then the whole site started as on the server.
name: Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Tests (dans l'image PHP du serveur)
        run: |
          docker build --target test -t sabonea-test .
          docker run --rm sabonea-test

      - name: Configuration comme sur le serveur
        run: |
          cp .env.production.example .env
          sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" .env
          sed -i "s|^APP_URL=.*|APP_URL=http://localhost|" .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^MAIL_MAILER=.*|MAIL_MAILER=log|" .env

      - name: Démarrage du site (app, web, db)
        run: |
          docker compose up -d --build
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost/up; then echo "Site prêt"; exit 0; fi
            sleep 3
          done
          echo "Le site ne répond pas"; exit 1

      - name: Données de départ et pages principales
        run: |
          docker compose exec -T app php artisan db:seed --force
          check() { code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost$1"); echo "$1 -> $code"; [ "$code" = "$2" ]; }
          check /fr 200
          check /zh/contact 200
          check /fr/devenir-fournisseur 200
          check /admin/login 200
          check /css/sabonea.css 200
          check /img/sabonea/logo-sabonea.png 200
          check /page-qui-n-existe-pas 404
          curl -s http://localhost/fr | grep -q "Sabonea"
          curl -s http://localhost/admin/login | grep -q "js/filament"

      - name: Journaux en cas d'échec
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color
          docker compose exec -T app sh -c 'cat storage/logs/*.log' || true

      - name: Arrêt
        if: always()
        run: docker compose down -v
