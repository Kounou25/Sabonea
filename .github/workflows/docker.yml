# Checks, on every push, that the Docker version of the site builds and works:
# tests in the image, then the whole site deployed with deploy.sh exactly as on the server.
name: Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Quotes, $ and # on purpose: the password must reach Laravel exactly as typed.
      MAIL_PASSWORD: 'p@ss''w$rd #1 "x"'

    steps:
      - uses: actions/checkout@v4

      - name: Tests (dans l'image PHP du serveur)
        run: |
          docker build --target test -t sabonea-test .
          docker run --rm sabonea-test

      - name: Configuration automatique (deploy.sh)
        run: |
          bash deploy.sh --config-only
          grep -Eq '^APP_KEY=base64:.{44}$' .env
          grep -Eq '^DB_PASSWORD=[0-9a-f]{48}$' .env
          # No e-mails from GitHub; pages checked on localhost.
          sed -i -e 's|^MAIL_MAILER=.*|MAIL_MAILER=log|' -e 's|^APP_URL=.*|APP_URL=http://localhost|' .env

      - name: Premier déploiement (deploy.sh)
        run: bash deploy.sh

      - name: Pages principales
        run: |
          for attempt in $(seq 1 20); do curl -fsS -o /dev/null http://localhost/up && break; sleep 2; done
          check() { code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost$1"); echo "$1 -> $code"; [ "$code" = "$2" ]; }
          check /up 200
          check /fr 200
          check /zh/contact 200
          check /fr/devenir-fournisseur 200
          check /admin/login 200
          check /css/sabonea.css 200
          check /img/sabonea/logo-sabonea.png 200
          check /page-qui-n-existe-pas 404
          curl -s http://localhost/fr | grep -q "Sabonea"
          curl -s http://localhost/admin/login | grep -q "js/filament"
          password=$(docker compose exec -T app php artisan tinker --execute='echo config("mail.mailers.smtp.password");')
          if [ "$password" != "$MAIL_PASSWORD" ]; then echo "Mot de passe mail mal lu : $password"; exit 1; fi

      - name: Redéploiement (données conservées)
        run: |
          bash deploy.sh | tee deploiement.log
          grep -q "Base existante : conservée" deploiement.log
          if grep -q "Contenu de départ" deploiement.log; then echo "Contenu de départ réinstallé"; exit 1; fi
          curl -fsS -o /dev/null http://localhost/fr

      - name: Journaux en cas d'échec
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color
          docker compose exec -T app sh -c 'cat storage/logs/*.log' || true

      - name: Arrêt
        if: always()
        run: docker compose down -v
