; Sabonea: PHP settings of the containers.

; Supplier documents: 20 MB per file (form 2), several files per request.
upload_max_filesize = 20M
post_max_size = 25M
max_file_uploads = 20

; PDF profiles (dompdf, Chinese font) need memory. The PDF and e-mail code gives itself 2 minutes when needed.
memory_limit = 512M
max_execution_time = 60
max_input_vars = 5000

; Errors are logged by Laravel (storage/logs), never shown to visitors.
display_errors = Off
log_errors = On
expose_php = Off

; The code is part of the image: PHP does not need to check the files for changes.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
