; Sabonea: PHP-FPM pool (after the image's own settings, which listen on port 9000).
[www]
; Several visitors at the same time (a PDF profile or an e-mail never blocks the other pages).
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; The variables of the container reach PHP.
clear_env = no

; Errors of PHP itself in "docker compose logs app".
catch_workers_output = yes
decorate_workers_output = no
